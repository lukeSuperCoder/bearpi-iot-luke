<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BearPi Emoji Controller</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: #1a1a2e;
    color: #eee;
    min-height: 100vh;
}
header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 16px 24px;
    background: #16213e;
    border-bottom: 1px solid #0f3460;
}
header h1 { font-size: 20px; font-weight: 600; }
.status {
    display: flex;
    align-items: center;
    gap: 10px;
    font-size: 14px;
}
.dot {
    width: 10px; height: 10px;
    border-radius: 50%;
    background: #e74c3c;
    transition: background 0.3s;
}
.dot.connected { background: #2ecc71; }
button#connect {
    padding: 8px 20px;
    border: none;
    border-radius: 6px;
    background: #0f3460;
    color: #eee;
    font-size: 14px;
    cursor: pointer;
    transition: background 0.2s;
}
button#connect:hover { background: #1a4a8a; }
button#connect:disabled { opacity: 0.5; cursor: default; }
.grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(120px, 1fr));
    gap: 12px;
    padding: 24px;
    max-width: 720px;
    margin: 0 auto;
}
.emoji-card {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 6px;
    padding: 12px 8px;
    border-radius: 10px;
    background: #16213e;
    border: 2px solid transparent;
    cursor: pointer;
    transition: all 0.2s;
}
.emoji-card:hover { background: #1a2a4a; border-color: #0f3460; }
.emoji-card.active { border-color: #e94560; background: #1a2a4a; }
.emoji-card.disabled { opacity: 0.4; cursor: default; }
.emoji-card img { width: 64px; height: 64px; image-rendering: pixelated; }
.emoji-card span { font-size: 12px; color: #aaa; text-align: center; line-height: 1.3; }
.log {
    max-width: 720px;
    margin: 0 auto 24px;
    padding: 0 24px;
}
.log h3 { font-size: 14px; color: #888; margin-bottom: 8px; }
.log-box {
    background: #0d1117;
    border-radius: 8px;
    padding: 12px;
    max-height: 150px;
    overflow-y: auto;
    font-family: "SF Mono", Menlo, Consolas, monospace;
    font-size: 13px;
    line-height: 1.6;
}
.log-box .ok { color: #2ecc71; }
.log-box .err { color: #e74c3c; }
.log-box .info { color: #3498db; }
.count-info {
    text-align: center;
    padding: 8px;
    color: #3498db;
    font-size: 14px;
}
</style>
</head>
<body>

<header>
    <h1>BearPi Emoji Controller</h1>
    <div class="status">
        <div class="dot" id="dot"></div>
        <span id="statusText">Not connected</span>
        <button id="connect">Connect</button>
    </div>
</header>

<div class="count-info" id="countInfo" style="display:none"></div>
<div class="grid" id="grid"></div>

<div class="log">
    <h3>Log</h3>
    <div class="log-box" id="logBox"></div>
</div>

<script>
/* Emoji definitions: PNG preview file + display name.
   For emojis beyond this list, numbered cards are generated dynamically. */
const KNOWN_EMOJIS = [
    { file: "emoji_png/00_grinning.png", name: "Grinning" },
    { file: "emoji_png/01_tears_of_joy.png", name: "Tears of Joy" },
    { file: "emoji_png/02_winking.png", name: "Winking" },
    { file: "emoji_png/03_heart_eyes.png", name: "Heart Eyes" },
    { file: "emoji_png/04_cool.png", name: "Cool" },
    { file: "emoji_png/05_neutral.png", name: "Neutral" },
    { file: "emoji_png/06_unamused.png", name: "Unamused" },
    { file: "emoji_png/07_disappointed.png", name: "Disappointed" },
    { file: "emoji_png/08_angry.png", name: "Angry" },
    { file: "emoji_png/09_crying.png", name: "Crying" },
    { file: "emoji_png/10_surprised.png", name: "Surprised" },
    { file: "emoji_png/11_screaming.png", name: "Screaming" },
    { file: "emoji_png/12_flushed.png", name: "Flushed" },
    { file: "emoji_png/13_sleeping.png", name: "Sleeping" },
    { file: "emoji_png/14_dizzy.png", name: "Dizzy" },
    { file: "emoji_png/15_money_mouth.png", name: "Money Mouth" },
    { file: "emoji_png/16_nerd.png", name: "Nerd" },
    { file: "emoji_png/17_thinking.png", name: "Thinking" },
    { file: "emoji_png/18_hugging.png", name: "Hugging" },
    { file: "emoji_png/19_exploding_head.png", name: "Exploding Head" }
];

let port = null;
let reader = null;
let writer = null;
let emojiCount = 0;
let activeIdx = -1;

const grid = document.getElementById("grid");
const logBox = document.getElementById("logBox");
const dot = document.getElementById("dot");
const statusText = document.getElementById("statusText");
const connectBtn = document.getElementById("connect");
const countInfo = document.getElementById("countInfo");

function buildGrid(count) {
    grid.innerHTML = "";
    for (let i = 0; i < count; i++) {
        const card = document.createElement("div");
        card.className = "emoji-card disabled";
        card.dataset.index = i;
        const known = KNOWN_EMOJIS[i];
        if (known) {
            card.innerHTML = `<img src="${known.file}" alt="${known.name}"><span>${i + 1}. ${known.name}</span>`;
        } else {
            card.innerHTML = `<div style="width:64px;height:64px;background:#0f3460;display:flex;align-items:center;justify-content:center;font-size:24px;border-radius:8px">${i + 1}</div><span>Emoji #${i + 1}</span>`;
        }
        card.addEventListener("click", () => sendEmoji(i));
        grid.appendChild(card);
    }
}

buildGrid(KNOWN_EMOJIS.length);

function setConnected(state) {
    dot.className = "dot" + (state ? " connected" : "");
    statusText.textContent = state ? "Connected" : "Not connected";
    connectBtn.textContent = state ? "Disconnect" : "Connect";
    document.querySelectorAll(".emoji-card").forEach(c => {
        c.classList.toggle("disabled", !state);
    });
}

function log(msg, cls) {
    const line = document.createElement("div");
    if (cls) line.className = cls;
    line.textContent = `[${new Date().toLocaleTimeString()}] ${msg}`;
    logBox.appendChild(line);
    logBox.scrollTop = logBox.scrollHeight;
}

function parseStartupMessage(text) {
    const match = text.match(/Loaded (\d+) emojis from SD card/);
    if (match) {
        const count = parseInt(match[1], 10);
        if (count > 0 && count !== emojiCount) {
            emojiCount = count;
            buildGrid(count);
            countInfo.textContent = `SD Card: ${count} emojis loaded`;
            countInfo.style.display = "block";
            if (port) {
                document.querySelectorAll(".emoji-card").forEach(c => c.classList.remove("disabled"));
            }
        }
    }
}

async function startReading() {
    const decoder = new TextDecoder();
    let buf = "";
    while (port && port.readable) {
        try {
            reader = port.readable.getReader();
            while (true) {
                const { value, done } = await reader.read();
                if (done) break;
                buf += decoder.decode(value, { stream: true });
                const lines = buf.split("\r\n");
                buf = lines.pop();
                for (const line of lines) {
                    if (!line) continue;
                    parseStartupMessage(line);
                    if (line.startsWith("OK:")) {
                        log(line, "ok");
                    } else if (line.startsWith("ERR:")) {
                        log(line, "err");
                    } else if (!line.includes("A14 UART")) {
                        log(line, "info");
                    } else {
                        log(line, "info");
                    }
                }
            }
        } catch (_) {
            // port closed or error
        } finally {
            if (reader) { reader.releaseLock(); reader = null; }
        }
    }
}

async function connectSerial() {
    try {
        port = await navigator.serial.requestPort();
        await port.open({ baudRate: 115200 });
        setConnected(true);
        log("Serial port opened", "ok");
        startReading();
    } catch (e) {
        log("Connection failed: " + e.message, "err");
        port = null;
    }
}

async function disconnectSerial() {
    if (reader) { await reader.cancel(); reader = null; }
    if (port) { await port.close(); port = null; }
    setConnected(false);
    activeIdx = -1;
    document.querySelectorAll(".emoji-card").forEach(c => c.classList.remove("active"));
    log("Disconnected", "info");
}

connectBtn.addEventListener("click", () => {
    if (port) {
        disconnectSerial();
    } else {
        connectSerial();
    }
});

async function sendEmoji(index) {
    if (!port || !port.writable) return;
    const card = document.querySelector(`.emoji-card[data-index="${index}"]`);
    if (!card || card.classList.contains("disabled")) return;

    document.querySelectorAll(".emoji-card").forEach(c => c.classList.remove("active"));
    card.classList.add("active");
    activeIdx = index;

    const num = index + 1;
    const encoder = new TextEncoder();
    writer = port.writable.getWriter();
    try {
        await writer.write(encoder.encode(num + "\n"));
        const known = KNOWN_EMOJIS[index];
        const name = known ? known.name : `Emoji #${num}`;
        log(`Sent: ${num} (${name})`, "info");
    } catch (e) {
        log("Send failed: " + e.message, "err");
    } finally {
        writer.releaseLock();
        writer = null;
    }
}

if (!("serial" in navigator)) {
    log("Web Serial API not supported. Use Chrome or Edge.", "err");
    connectBtn.disabled = true;
    statusText.textContent = "Unsupported browser";
}
</script>
</body>
</html>
